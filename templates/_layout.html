<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sayfa başlığı, her sayfada özel olarak belirlenecek -->
    <title>{% block title %}NutriChat AI{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <!-- ============================================== -->
    <!-- TÜM SAYFALARDA GÖRÜNECEK SABİT HEADER         -->
    <!-- ============================================== -->
    <header class="global-header">
        <a href="/" class="logo">
            <i class="fa-solid fa-seedling"></i>
            <strong>NutriChat AI</strong>
        </a>
        <div class="header-actions">
    {% if user_logged_in %}
        <!-- DEĞİŞİKLİK: Link artık /profil'e gidiyor -->
        <a href="/profil" class="profile-icon" title="Profilim">
            <i class="fa-solid fa-user"></i>
        </a>
        <button id="logout-button" onclick="app.logout()">Çıkış Yap</button>
    {% else %}
        <!-- ... -->
    {% endif %}
</div>
    </header>

    <!-- ============================================== -->
    <!-- SAYFA İÇERİĞİNİN GELECEĞİ ALAN                -->
    <!-- ============================================== -->
    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
    
    <script src="/static/script.js"></script>
</body>
</html>
