{% extends "_layout.html" %}

{% block title %}Giriş Yap - NutriChat AI{% endblock %}

{% block body_id %}login-page-body{% endblock %}

{% block content %}
<div class="page active">
    <div class="form-container">
        <!-- Giriş Formu -->
        <div id="login-form">
            <h2>Oturum Aç</h2>
            <div class="form-group"><input type="email" id="login-email" placeholder="E-posta Adresiniz" required></div>
            <div class="form-group"><input type="password" id="login-password" placeholder="Şifreniz" required></div>
            <div class="form-group"><button onclick="auth.login()">Giriş Yap</button></div>
            <p class="auth-toggle" onclick="auth.toggleForm()">Hesabınız yok mu? <b>Kayıt Olun</b></p>
        </div>
        <!-- Kayıt Formu (Başta Gizli) -->
        <div id="signup-form" style="display: none;">
            <h2>Hesap Oluşturun</h2>
            <div class="form-group"><input type="email" id="signup-email" placeholder="E-posta Adresiniz" required>
            </div>
            <div class="form-group"><input type="password" id="signup-password" placeholder="Şifreniz" required></div>
            <div class="form-group"><button onclick="auth.signup()">Kayıt Ol</button></div>
            <p class="auth-toggle" onclick="auth.toggleForm()">Zaten bir hesabınız var mı? <b>Giriş Yapın</b></p>
        </div>
    </div>
</div>
{% endblock %}
